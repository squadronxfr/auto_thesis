version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres-docker
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: redis-docker
    ports:
      - "6379:6379"

volumes:
  postgres_data:
