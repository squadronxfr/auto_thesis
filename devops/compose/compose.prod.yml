services:
  postgres:
    image: postgres:16
    container_name: auto_thesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: auto_thesis_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # backend:
  #   image: ghcr.io/${GHCR_OWNER:-squadronxfr}/${GHCR_REPO:-auto_thesis}-backend:${APP_VERSION:-latest}
  #   container_name: auto_thesis_backend
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
  #     REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   ports:
  #     - "${BACKEND_HOST_PORT:-40001}:8080"
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://frontend:8080/health || exit 1"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 10
  #   networks:
  #     - app-network

  frontend:
    image: ghcr.io/${GHCR_OWNER:-squadronxfr}/${GHCR_REPO:-auto_thesis}-frontend:${APP_VERSION:-latest}
    container_name: auto_thesis_frontend
    restart: unless-stopped
    # depends_on:
    #   backend:
    #     condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-40000}:80"
    networks:
      - app-network

volumes:
  pg_data:
  redis_data:

networks:
  app-network:
    driver: bridge