services:
  postgres:
    image: postgres:16
    container_name: auto_thesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../DB/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: auto_thesis_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    ports:
      - "40010:40010"
    networks:
      - app-network

  backend:
    image: ghcr.io/${GHCR_OWNER}/auto_thesis-backend:${APP_VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8080}:${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.environ.get('PORT','8080'))"]
      interval: 15s
      timeout: 5s
      retries: 10

  mcp:
    image: ghcr.io/${GHCR_OWNER}/auto_thesis-mcp:${APP_VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${MCP_PORT:-3000}
      DATA_DIR: /app/data
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      MCP_URL: ${MCP_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${MCP_HOST_PORT:-8081}:${MCP_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-3000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10


  frontend:
    image: ghcr.io/${GHCR_OWNER:-squadronxfr}/${GHCR_REPO:-auto_thesis}-frontend:${APP_VERSION:-latest}
    container_name: auto_thesis_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-40000}:80"
    networks:
      - app-network

volumes:
  pg_data:
  redis_data:

networks:
  app-network:
    driver: bridge
